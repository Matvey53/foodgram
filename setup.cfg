[flake8]
ignore =
    W503
exclude =
    .git,
    tests/,
    */migrations/,
    data/,
    venv/,
    */venv/,
    env/,
    docs/,
    frontend/,
    infra/
per-file-ignores =
    */settings.py:E501

[isort]
profile = black
line_length = 79
skip = migrations,venv,.venv
known_first_party = api,recipes,users,foodgram
known_third_party = django,rest_framework,djoser,django_filters,dotenv,drf_extra_fields
