name: Seed review data

on:
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy seed script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          port: 22
          source: "infra/seed_review_data.py"
          target: "foodgram"
      - name: Create review admin and recipes
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
          port: 22
          script: |
            set -e
            docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'
            docker cp ~/foodgram/infra/seed_review_data.py foodgram-backend:/tmp/seed_review_data.py
            docker exec foodgram-backend python /tmp/seed_review_data.py
            echo '--- localhost ---'
            curl -sI -m 5 http://127.0.0.1 | head -8
            echo '--- recipes ---'
            curl -s -m 8 http://127.0.0.1/api/recipes/ | head -c 400
            echo
            echo '--- docs ---'
            curl -sI -m 5 http://127.0.0.1/api/docs/ | head -8
            hostname -I
